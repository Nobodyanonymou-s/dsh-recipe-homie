# 作为 bundle 安装时（pnpm add 进 profile）由这一层挂载。
# 直接以文件路径挂载时，改用 profile 的 cordis.patch.yml 里同名的 insert 条目。
- insert:
    - id: foodbot
      name: "dsh-foodbot"
      config:
        # 指向工作区里那棵活的 data/（不是安装包里的快照）：
        # 重建库后下一次查询就生效，不用重新打包。profile.json / user-state.json 也在这里。
        dataDir: "<你的语料目录，如复制 data-sample 后的位置>"
        limit: 8
