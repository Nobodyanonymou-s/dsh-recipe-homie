# 作为 bundle 安装时（pnpm add 进 profile）由这一层挂载。
# 直接以文件路径挂载时，改用 profile 的 cordis.patch.yml 里同名的 insert 条目。
- insert:
    - id: recipe-homie
      name: "dsh-recipe-homie"
      config:
        # dataDir 留空 = 装机即可用：代码找不到语料时自动回退随包 data-sample
        # （示例语料 + 提示怎么接全库）。要查全库就指向一棵活的 data/ 目录：
        #   dataDir: "C:/path/to/recipe-homie/data"
        # 重建库后下一次查询就生效，不用重新打包。profile.json / user-state.json
        # 写在 dataDir 的上一级（data-sample 回退时写到 ~/.dsh/recipe-homie/）。
        dataDir: ""
        limit: 8
